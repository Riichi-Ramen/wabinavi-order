<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>和美なび WABI NAVI — Książki (Staff)</title>
<style>
:root{
  --accent:#c0392b;--text:#2c1810;--muted:#7a6858;
  --border:rgba(180,140,110,0.35);--green:#2d7a3a;--amber:#b9770e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',sans-serif;min-height:100vh;
  background-color:#f7f0e6;
  background-image:linear-gradient(160deg,#f7f0e6 0%,#ede0cc 40%,#f0e4d0 100%);
  display:flex;flex-direction:column;align-items:center;
  padding:1.2rem 1rem 3rem;color:var(--text);
}
.logo-txt{font-size:1.5rem;font-weight:700;color:var(--accent);letter-spacing:.15em;cursor:pointer;user-select:none}
.title{font-size:.95rem;color:var(--accent);font-weight:700;text-align:center;margin:.2rem 0 1rem}
.card{background:rgba(255,252,245,0.95);border:1px solid rgba(192,57,43,0.2);border-radius:16px;
  padding:1.3rem;width:100%;max-width:560px;box-shadow:0 6px 30px rgba(120,60,40,0.12);margin-bottom:1rem}
.form-label{font-size:.75rem;color:var(--muted);margin-bottom:.3rem;display:block;text-transform:uppercase;letter-spacing:.05em}
.form-input{width:100%;background:rgba(255,252,248,0.9);border:1.5px solid rgba(192,57,43,0.3);
  color:var(--text);border-radius:8px;padding:.7rem .9rem;font-size:1rem;font-family:inherit;margin-bottom:.8rem}
.form-input:focus{outline:none;border-color:var(--accent)}
.btn{padding:.8rem 1rem;border:none;border-radius:10px;font-weight:700;font-size:.9rem;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff;width:100%;box-shadow:0 4px 14px rgba(192,57,43,0.3)}
.btn-green{background:var(--green);color:#fff;width:100%}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--muted);width:100%}
.btn-row{display:flex;gap:.5rem;margin-top:.6rem}
.btn-row .btn{flex:1}
.error-msg{background:#fee;border:1px solid #f5c6c6;border-radius:8px;padding:.6rem;
  font-size:.8rem;color:#a00;text-align:center;margin-bottom:.8rem;display:none}
.tabs{display:flex;gap:.4rem;width:100%;max-width:560px;margin-bottom:.8rem}
.tab{flex:1;padding:.7rem .3rem;border-radius:10px;border:1.5px solid var(--border);background:transparent;
  color:var(--muted);font-weight:700;font-size:.82rem;cursor:pointer;font-family:inherit}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.step{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem}
.step b{color:var(--accent);font-size:.95rem}
#reader{width:100%;border-radius:12px;overflow:hidden;margin-bottom:.7rem;background:#000;min-height:60px}
#reader:empty{display:none}
.scan-hint{font-size:.78rem;color:var(--muted);text-align:center;margin-bottom:.6rem;line-height:1.6}
.book-box{border:1.5px solid var(--border);border-radius:12px;padding:.9rem;margin-bottom:.8rem;background:rgba(255,255,255,.6)}
.book-id{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--accent);font-size:.95rem}
.book-title{font-weight:700;font-size:.95rem;margin:.25rem 0;line-height:1.45}
.book-meta{font-size:.76rem;color:var(--muted);line-height:1.6}
.badge{display:inline-block;border-radius:20px;padding:.15rem .7rem;font-size:.72rem;font-weight:700}
.badge-ok{background:#e6f4ea;color:var(--green)}
.badge-lent{background:#fdebd0;color:var(--amber)}
.badge-over{background:#fadbd8;color:#a00}
.result{text-align:center;padding:.5rem 0}
.result .big{font-size:2rem;margin-bottom:.4rem}
.result .due{font-size:1.6rem;font-weight:700;color:var(--accent);letter-spacing:.03em;margin:.5rem 0}
.result .sub{font-size:.82rem;color:var(--muted);line-height:1.7}
.gift{background:#fff8e7;border:1.5px dashed var(--amber);border-radius:10px;padding:.7rem;
  font-size:.82rem;color:#7a5c00;margin-top:.8rem;line-height:1.6}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:.6rem;
  border-bottom:1px solid var(--border);padding:.6rem .1rem;font-size:.8rem}
.list-row:last-child{border-bottom:none}
.list-main{flex:1;min-width:0}
.list-main .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-main .m{font-size:.72rem;color:var(--muted)}
.days{font-weight:700;font-size:.78rem;white-space:nowrap}
.days.ok{color:var(--green)}.days.soon{color:var(--amber)}.days.over{color:#a00}
.spinner{width:26px;height:26px;border:3px solid rgba(192,57,43,.2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;margin:1.5rem auto}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none}
.slot{display:flex;align-items:center;gap:.6rem;border:1.5px solid var(--border);border-radius:10px;
  padding:.55rem .7rem;margin-bottom:.45rem;font-size:.82rem;background:rgba(255,255,255,.55)}
.slot.filled{border-color:var(--green);background:#f2fbf4}
.slot .ico{font-size:1.1rem;flex:none}
.slot .body{flex:1;min-width:0}
.slot .lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.slot .val{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .val.empty{font-weight:400;color:var(--muted)}
.slot .x{background:none;border:none;color:var(--muted);font-size:1rem;cursor:pointer;padding:.2rem .3rem}
.note{font-size:.74rem;color:var(--muted);line-height:1.7;margin-top:.7rem}
</style>
</head>
<body>

<div class="logo-txt" id="logo-tap">和美なび</div>
<div class="title">📚 Wypożyczalnia — panel obsługi / 書籍カウンター</div>

<!-- ══ ログイン ══ -->
<div class="card" id="login-card">
  <div class="error-msg" id="login-err"></div>
  <label class="form-label">Hasło obsługi / 係員パスワード</label>
  <input type="password" class="form-input" id="pw" onkeydown="if(event.key==='Enter')login()">
  <button class="btn btn-primary" onclick="login()">Zaloguj / ログイン</button>
</div>

<!-- ══ メイン ══ -->
<div id="main" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center">
  <div class="tabs">
    <button class="tab active" id="tab-lend"   onclick="setMode('lend')">📕 Wypożycz<br><small>貸出</small></button>
    <button class="tab" id="tab-return" onclick="setMode('return')">📗 Zwrot<br><small>返却</small></button>
    <button class="tab" id="tab-list"   onclick="setMode('list')">📋 Wydane<br><small>貸出中</small></button>
  </div>

  <!-- ── スキャン画面 ── -->
  <div class="card" id="scan-card">
    <div class="error-msg" id="err"></div>
    <div class="step" id="step-txt"></div>
    <div id="slots" class="hidden"></div>
    <div id="reader"></div>
    <div class="scan-hint" id="scan-hint"></div>
    <div class="btn-row" style="margin-bottom:.8rem">
      <button class="btn btn-ghost" id="cam-btn" onclick="toggleCam()">📷 Kamera / カメラ</button>
    </div>
    <label class="form-label" id="manual-label">lub wpisz ręcznie / 手入力</label>
    <input class="form-input" id="manual" autocapitalize="off" autocomplete="off"
           onkeydown="if(event.key==='Enter')submitManual()">
    <button class="btn btn-primary" onclick="submitManual()">OK</button>
    <div class="note" id="scan-note"></div>
  </div>

  <!-- ── 確認・結果 ── -->
  <div class="card hidden" id="detail-card"></div>

  <!-- ── 貸出中一覧 ── -->
  <div class="card hidden" id="list-card"><div class="spinner"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"
        onerror="this.onerror=null;var s=document.createElement('script');s.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';document.head.appendChild(s);"></script>
<script>
const GAS_URL = localStorage.getItem('wabi_gas_url') ||
  'https://script.google.com/macros/s/AKfycbztP0245VXY7DRrjOQC9m4tu-DWKcGzPwT0QzBNgxfLxgczmYmQYlP8ErEz4umoJ3FN/exec';

let tapCount = 0;
document.getElementById('logo-tap').onclick = () => {
  if (++tapCount >= 5) { tapCount = 0;
    const u = prompt('GAS URL:', GAS_URL);
    if (u !== null) { localStorage.setItem('wabi_gas_url', u.trim()); location.reload(); }
  }
};

let PW    = sessionStorage.getItem('wabi_staff_pw') || '';
let MODE  = 'lend';               // lend / return / list
let LEND  = { book:null, member:null };   // 貸出の2要素（どちらから読んでもよい）
let BASKET = [];                  // 同一会員に続けて貸した本（全巻まとめ借り用）
let MAXBOOKS = 2;                 // GASから受け取る上限（表示用。判定はサーバー側）
let CURBOOK = null;               // 返却・延長で扱う本
let scanner = null, camOn = false;

// ── 通信 ─────────────────────────────────────────────────────────
async function postGAS(payload){
  const res = await fetch(GAS_URL, { method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload) });
  return res.json();
}
function api(op, extra){
  return postGAS(Object.assign({ action:'staffBook', op, password: PW }, extra || {}));
}
function showErr(msg){
  const e = document.getElementById('err');
  e.textContent = msg; e.style.display = msg ? 'block' : 'none';
  if (msg) setTimeout(()=>{ e.style.display='none'; }, 6000);
}
function busy(on){
  document.body.style.opacity = on ? '.6' : '1';
  document.body.style.pointerEvents = on ? 'none' : 'auto';
}

// ── ログイン ─────────────────────────────────────────────────────
async function login(){
  const pw = document.getElementById('pw').value;
  const e  = document.getElementById('login-err');
  if (!pw) return;
  e.style.display = 'none';
  try {
    const r = await postGAS({ action:'staffBook', op:'listLent', password: pw });
    if (r.status === 'unauthorized') {
      e.textContent = r.message || 'Nieprawidłowe hasło'; e.style.display='block'; return;
    }
    PW = pw; sessionStorage.setItem('wabi_staff_pw', pw);
    document.getElementById('login-card').classList.add('hidden');
    document.getElementById('main').classList.remove('hidden');
    setMode('lend');
  } catch(err){
    e.textContent = 'Błąd połączenia / 通信エラー'; e.style.display='block';
  }
}
if (PW) {
  document.getElementById('login-card').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  window.addEventListener('load', ()=>setMode('lend'));
}

// ── モード切替 ───────────────────────────────────────────────────
function setMode(m){
  MODE = m; LEND = { book:null, member:null }; BASKET = []; CURBOOK = null;
  ['lend','return','list'].forEach(k =>
    document.getElementById('tab-'+k).classList.toggle('active', k===m));
  document.getElementById('detail-card').classList.add('hidden');
  document.getElementById('list-card').classList.add('hidden');
  document.getElementById('scan-card').classList.toggle('hidden', m==='list');
  showErr('');
  if (m === 'list') { stopCam(); loadList(); return; }
  renderStep();
}

function renderStep(){
  const st   = document.getElementById('step-txt');
  const hint = document.getElementById('scan-hint');
  const lab  = document.getElementById('manual-label');
  const note = document.getElementById('scan-note');
  const slots= document.getElementById('slots');
  document.getElementById('manual').value = '';

  if (MODE === 'lend') {
    st.innerHTML = 'Wypożyczenie / 貸出 &nbsp; <b>Zeskanuj oba kody</b>';
    hint.innerHTML = 'Książka i karta członka — <b>w dowolnej kolejności</b>.<br>' +
                     '本のQRと会員カードのQR、<b>どちらから読んでもOK</b>です。';
    lab.textContent = 'lub wpisz ręcznie / 手入力（Cook-01 · WN-M-0001 · e-mail · tel.）';
    note.innerHTML = 'Wypożyczenie tylko dla członków (bezpłatne) · limit ' + MAXBOOKS + ' książki na osobę.<br>' +
                     '貸出は会員限定（無料）・お一人 ' + MAXBOOKS + '冊まで。未登録の方はその場で登録できます。';
    slots.classList.remove('hidden');
    renderSlots();
  } else {
    st.innerHTML = 'Zwrot / 返却 &nbsp; <b>📗 Zeskanuj książkę</b>';
    hint.innerHTML = 'Naskanuj kod QR zwracanej książki.<br>返却された本のQRを読み取ってください。<br>' +
                     '<small>Karta członka pokaże listę jego książek / 会員カードを読むとその方の貸出一覧が出ます</small>';
    lab.textContent = 'lub wpisz numer (np. Cook-01) / 管理番号を手入力';
    note.innerHTML = '';
    slots.classList.add('hidden');
  }
  document.getElementById('manual').focus();
}

// ── 貸出スロットの表示 ───────────────────────────────────────────
function renderSlots(){
  const b = LEND.book, m = LEND.member;
  document.getElementById('slots').innerHTML =
    `<div class="slot ${b?'filled':''}">
       <div class="ico">${b?'✅':'📕'}</div>
       <div class="body"><div class="lbl">Książka / 書籍</div>
         <div class="val ${b?'':'empty'}">${b ? esc(b.id)+' · '+esc(b.title) : 'czeka na skan / 未スキャン'}</div></div>
       ${b?'<button class="x" onclick="clearSlot(&quot;book&quot;)">✕</button>':''}
     </div>
     <div class="slot ${m?'filled':''}">
       <div class="ico">${m ? (m.remaining>0?'✅':'🚫') : '🎫'}</div>
       <div class="body"><div class="lbl">Członek / 会員${m?' &nbsp;·&nbsp; pozostało / 残り <b>'+m.remaining+'</b> / '+MAXBOOKS:''}</div>
         <div class="val ${m?'':'empty'}">${m ? esc(m.name)+'（'+esc(m.memberId)+'）' : 'czeka na skan / 未スキャン'}</div></div>
       ${m?'<button class="x" onclick="clearSlot(&quot;member&quot;)">✕</button>':''}
     </div>`;
}
function clearSlot(k){
  LEND[k] = null;
  document.getElementById('detail-card').classList.add('hidden');
  renderSlots();
}

// ── カメラ ───────────────────────────────────────────────────────
function toggleCam(){ camOn ? stopCam() : startCam(); }
async function startCam(){
  if (typeof Html5Qrcode === 'undefined') {
    showErr('Skaner niedostępny — wpisz numer ręcznie / スキャナ利用不可。手入力してください'); return;
  }
  try {
    scanner = new Html5Qrcode('reader');
    await scanner.start({ facingMode:'environment' },
      { fps:10, qrbox:{ width:230, height:230 } },
      txt => { onScan(txt); },
      () => {});
    camOn = true;
    document.getElementById('cam-btn').textContent = '⏹ Zatrzymaj / 停止';
  } catch(e){
    showErr('Brak dostępu do kamery / カメラを利用できません');
  }
}
async function stopCam(){
  if (scanner && camOn) { try { await scanner.stop(); scanner.clear(); } catch(e){} }
  camOn = false; scanner = null;
  document.getElementById('reader').innerHTML = '';
  const b = document.getElementById('cam-btn');
  if (b) b.textContent = '📷 Kamera / カメラ';
}

let lastScan = '', lastTime = 0;
function onScan(text){
  const now = Date.now();
  if (text === lastScan && now - lastTime < 2500) return;   // 連続読み取り防止
  lastScan = text; lastTime = now;
  if (navigator.vibrate) navigator.vibrate(60);
  handleCode(text.trim());
}
function submitManual(){
  const v = document.getElementById('manual').value.trim();
  if (v) handleCode(v);
}

// ── コードの種類を判定 ───────────────────────────────────────────
//  QRならプレフィックスで確実に判別。手入力は形で推測し、
//  外れた場合はもう一方として自動的に再照会する（順番も種類も気にしなくてよい）
function detectType(code){
  const c = code.trim();
  if (/^WABIBOOK\s*:/i.test(c)) return 'book';
  if (/^WABINAVI\s*:/i.test(c)) return 'member';
  if (/^WN-/i.test(c))          return 'member';
  if (c.indexOf('@') !== -1)    return 'member';
  if (/^\+?\d[\d\s-]{7,}$/.test(c)) return 'member';
  return 'book';
}

async function handleCode(code){
  showErr('');
  busy(true);
  try {
    let kind = detectType(code);
    let r    = await lookupAs(kind, code);
    // 推測が外れたら、もう一方の種類で照会し直す
    if (r.status === 'notFound' && !/^WAB/i.test(code)) {
      const other = kind === 'book' ? 'member' : 'book';
      const r2 = await lookupAs(other, code);
      if (r2.status === 'ok') { kind = other; r = r2; }
    }
    if (r.status !== 'ok') { showErr(r.message || 'Błąd / エラー'); return; }

    if (MODE === 'return') return onReturnScan(kind, r);

    // ── 貸出モード ──
    if (kind === 'book') {
      if (r.book.lent) { CURBOOK = r.book; return showAlreadyLent(r.book); }
      if (LEND.member && LEND.member.remaining <= 0) {
        showErr('🚫 Limit ' + MAXBOOKS + ' książek na osobę / お一人 ' + MAXBOOKS + '冊までです');
        return;
      }
      LEND.book = r.book;
    } else {
      if (typeof r.maxBooks === 'number') MAXBOOKS = r.maxBooks;
      LEND.member = Object.assign({}, r.member,
        { remaining: (typeof r.remaining === 'number') ? r.remaining : MAXBOOKS });
      showBorrowedNote(r);
      if (LEND.member.remaining <= 0) { LEND.book = null; renderSlots(); return; }
    }
    renderSlots();
    if (LEND.book && LEND.member) await doLend();
  } catch(e){
    showErr('Błąd połączenia / 通信エラー');
  } finally { busy(false); }
}
function lookupAs(kind, code){
  return kind === 'book' ? api('lookup', { bookId: code })
                         : api('member', { memberId: code });
}

// ── 貸出実行（会員はそのまま残るので、続けて何冊でもスキャンできる） ──
async function doLend(){
  const r = await api('lend', { bookId: LEND.book.id, memberId: LEND.member.memberId });
  if (r.status !== 'ok') { showErr(r.message || 'Błąd'); return; }

  BASKET.push({ id: r.book.id, title: r.book.title, dueDate: r.dueDate });
  if (typeof r.maxBooks === 'number') MAXBOOKS = r.maxBooks;
  LEND.member.remaining = (typeof r.remaining === 'number')
    ? r.remaining : Math.max(0, LEND.member.remaining - 1);
  LEND.book = null;                       // 本の枠だけ空け、会員は保持
  renderSlots();
  renderBasket(r);
  document.getElementById('manual').value = '';
  document.getElementById('manual').focus();
}

// ── 貸出済みリスト（1冊目で完了、2冊目以降は積み上げ表示） ──
function renderBasket(r){
  const d = document.getElementById('detail-card');
  const rows = BASKET.map((b,i) =>
    `<div class="list-row"><div class="list-main">
       <div class="t">${i+1}. ${esc(b.id)} · ${esc(b.title)}</div></div>
       <div class="days ok">✅</div></div>`).join('');
  d.innerHTML =
    `<div class="result">
       <div class="big">✅</div>
       <div style="font-weight:700">Wypożyczono ${BASKET.length} ${BASKET.length===1?'książkę':'szt.'} / ${BASKET.length}冊 貸出しました</div>
       <div class="sub" style="margin-top:.3rem"><b>${esc(LEND.member.name)}</b>（${esc(LEND.member.memberId)}）</div>
       <div class="form-label" style="margin-top:.8rem">Zwrot do / 返却予定日</div>
       <div class="due">${r.dueDate}</div>
       <div class="sub">${r.mailSent ? '📧 Potwierdzenie wysłane / 確認メール送信済み'
                                     : '✉️ Brak e-maila — poinformuj ustnie / メール未登録：口頭で'}</div>
     </div>
     ${rows}
     ${LEND.member.remaining > 0
       ? `<div class="gift">📚 Można wypożyczyć jeszcze <b>${LEND.member.remaining}</b> —
            skanuj dalej, ten sam członek pozostaje wybrany.<br>
            あと <b>${LEND.member.remaining}冊</b> 貸出できます。続けてスキャンしてください。</div>`
       : `<div class="gift">🚫 Osiągnięto limit ${MAXBOOKS} książek na osobę.<br>
            お一人 ${MAXBOOKS}冊の上限に達しました。返却後にまたご利用いただけます。</div>`}
     <div class="btn-row">
       <button class="btn btn-primary" onclick="setMode('lend')">✔ Zakończ / 会計へ（終了）</button>
     </div>`;
  d.classList.remove('hidden');
}

// ── 貸出中の本を読んだとき ───────────────────────────────────────
function showAlreadyLent(b){
  const d = document.getElementById('detail-card');
  d.innerHTML = bookBox(b) +
    `<div class="book-meta" style="text-align:center;margin-bottom:.6rem">
       Wypożyczona przez <b>${esc(b.memberName)}</b> do <b>${b.dueDate}</b><br>
       現在 ${esc(b.memberName)} さんに貸出中（返却予定 ${b.dueDate}）</div>
     <div class="btn-row">
       <button class="btn btn-green" onclick="doReturn(CURBOOK)">📗 Zwrot / 返却する</button>
       <button class="btn btn-ghost" onclick="doExtend()">➕ 3 tyg. / 延長</button>
     </div>
     <div class="btn-row"><button class="btn btn-ghost" onclick="setMode('lend')">↩ Anuluj / 戻る</button></div>`;
  d.classList.remove('hidden');
}

// ── 会員がすでに借りている本の状況を表示 ──
function showBorrowedNote(r){
  const list = r.lentBooks || [];
  const rem  = (typeof r.remaining === 'number') ? r.remaining : MAXBOOKS;
  const over = list.filter(b => b.daysLeft < 0);
  const d = document.getElementById('detail-card');

  if (rem <= 0) {
    // 上限に達している：どの本を返せば借りられるかを出す
    d.innerHTML =
      `<div class="result"><div class="big">🚫</div>
         <div style="font-weight:700">Limit ${MAXBOOKS} książek / お一人 ${MAXBOOKS}冊までです</div>
         <div class="sub" style="margin-top:.3rem"><b>${esc(r.member.name)}</b> —
           najpierw zwrot jednej z poniższych / まず下記のいずれかをご返却ください</div></div>` +
      list.map(b => {
        const cls = b.daysLeft < 0 ? 'over' : b.daysLeft <= 3 ? 'soon' : 'ok';
        return `<div class="list-row">
          <div class="list-main"><div class="t">${esc(b.id)} · ${esc(b.title)}</div>
            <div class="m">do ${b.dueDate}</div></div>
          <button class="btn btn-green" style="width:auto;padding:.45rem .8rem"
                  onclick="doReturn({id:'${esc(b.id)}'})">📗 Zwrot</button>
          <div class="days ${cls}">${b.daysLeft < 0 ? (-b.daysLeft)+'d' : b.daysLeft+'d'}</div>
        </div>`;
      }).join('') +
      `<div class="gift">💡 Zwrot można przyjąć od razu tutaj — potem zeskanuj nową książkę.<br>
        この場で返却を受け付けられます。返却後、あらためて本をスキャンしてください。</div>
       <div class="btn-row"><button class="btn btn-ghost" onclick="setMode('lend')">↩ 戻る</button></div>`;
    d.classList.remove('hidden');
    return;
  }

  if (over.length) {
    showErr('⚠️ Ten członek ma ' + over.length + ' książkę/i po terminie — poproś o zwrot / '
          + 'この会員は期限超過の本を' + over.length + '冊お持ちです');
  }
}

// ── 返却モードのスキャン ─────────────────────────────────────────
function onReturnScan(kind, r){
  if (kind === 'book') { CURBOOK = r.book; return doReturn(r.book); }
  // 会員カードを読んだ場合：その方の貸出一覧から選ばせる
  const list = r.lentBooks || [];
  const d = document.getElementById('detail-card');
  if (!list.length) {
    d.innerHTML = `<div class="result"><div class="big">📚</div>
      <div style="font-weight:700">${esc(r.member.name)}</div>
      <div class="sub">Brak wypożyczonych książek / 貸出中の本はありません</div></div>
      <div class="btn-row"><button class="btn btn-ghost" onclick="setMode('return')">↩ 戻る</button></div>`;
  } else {
    d.innerHTML = `<div class="step">${esc(r.member.name)} — wybierz książkę / 返却する本を選択</div>` +
      list.map(b => {
        const cls = b.daysLeft < 0 ? 'over' : b.daysLeft <= 3 ? 'soon' : 'ok';
        return `<div class="list-row">
          <div class="list-main"><div class="t">${esc(b.id)} · ${esc(b.title)}</div>
            <div class="m">do ${b.dueDate}</div></div>
          <button class="btn btn-green" style="width:auto;padding:.45rem .8rem"
                  onclick="doReturn({id:'${esc(b.id)}'})">📗 Zwrot</button>
          <div class="days ${cls}">${b.daysLeft < 0 ? (-b.daysLeft)+'d' : b.daysLeft+'d'}</div>
        </div>`;
      }).join('') +
      `<div class="btn-row"><button class="btn btn-ghost" onclick="setMode('return')">↩ 戻る</button></div>`;
  }
  d.classList.remove('hidden');
}

// ── 返却 ─────────────────────────────────────────────────────────
async function doReturn(b){
  busy(true);
  let r;
  try { r = await api('return', { bookId: b.id }); }
  finally { busy(false); }
  if (r.status !== 'ok') { showErr(r.message || 'Błąd'); return; }
  stopCam();
  document.getElementById('scan-card').classList.add('hidden');
  const gift = r.lateDays > 0
    ? `<div class="gift">🎁 Zwrot po terminie (${r.lateDays} dni) — <b>wręcz drobny upominek</b>
        i podziękuj za przyniesienie.<br>
        期限超過（${r.lateDays}日）。<b>サービス品をお渡しし</b>、お礼を伝えてください。</div>`
    : `<div class="gift">🎁 Zwrot w terminie — zaproponuj kolejną książkę!<br>
        期限内の返却です。次の1冊をおすすめしましょう。</div>`;
  const d = document.getElementById('detail-card');
  d.innerHTML =
    `<div class="result">
       <div class="big">📗</div>
       <div style="font-weight:700">Zwrot zapisany / 返却を記録しました</div>
       <div class="sub" style="margin-top:.4rem">${esc(r.book.title)}<br>${esc(r.book.id)}</div>
     </div>${gift}
     <div class="btn-row"><button class="btn btn-primary" onclick="setMode('return')">📗 Następna / 次の返却</button></div>`;
  d.classList.remove('hidden');
}

// ── 延長 ─────────────────────────────────────────────────────────
async function doExtend(){
  const r = await api('extend', { bookId: CURBOOK.id });
  if (r.status !== 'ok') { showErr(r.message || 'Błąd'); return; }
  const d = document.getElementById('detail-card');
  d.innerHTML =
    `<div class="result"><div class="big">➕</div>
       <div style="font-weight:700">Przedłużono / 延長しました</div>
       <div class="form-label" style="margin-top:.9rem">Nowy termin / 新しい返却予定日</div>
       <div class="due">${r.dueDate}</div></div>
     <div class="btn-row"><button class="btn btn-primary" onclick="setMode('lend')">↩ Powrót / 戻る</button></div>`;
}

// ── 貸出中一覧 ───────────────────────────────────────────────────
async function loadList(){
  const c = document.getElementById('list-card');
  c.classList.remove('hidden');
  c.innerHTML = '<div class="spinner"></div>';
  const r = await api('listLent');
  if (r.status !== 'ok') { c.innerHTML = '<div class="scan-hint">'+(r.message||'Błąd')+'</div>'; return; }
  if (!r.books.length) {
    c.innerHTML = '<div class="scan-hint">Wszystkie książki na półce 🎉<br>貸出中の本はありません。</div>'; return;
  }
  const over = r.books.filter(b => b.daysLeft < 0).length;
  c.innerHTML =
    `<div class="step">Wydane / 貸出中 <b>${r.books.length}</b>
       ${over ? '&nbsp;·&nbsp; po terminie / 超過 <b>'+over+'</b>' : ''}</div>` +
    r.books.map(b => {
      const dl = b.daysLeft;
      const cls = dl === null ? '' : dl < 0 ? 'over' : dl <= 3 ? 'soon' : 'ok';
      const txt = dl === null ? '—' : dl < 0 ? (-dl)+' dni po / 日超過'
                : dl === 0 ? 'dziś / 本日' : 'za '+dl+' dni / あと'+dl+'日';
      return `<div class="list-row">
        <div class="list-main">
          <div class="t">${esc(b.id)} · ${esc(b.title)}</div>
          <div class="m">${esc(b.memberName)}（${esc(b.memberId)}）· do ${b.dueDate}</div>
        </div><div class="days ${cls}">${txt}</div></div>`;
    }).join('');
}

// ── 部品 ─────────────────────────────────────────────────────────
function bookBox(b){
  const badge = b.lent
    ? '<span class="badge badge-lent">Wypożyczona / 貸出中</span>'
    : '<span class="badge badge-ok">Dostępna / 在庫あり</span>';
  return `<div class="book-box">
    <div class="book-id">${esc(b.id)}</div>
    <div class="book-title">${esc(b.title)}</div>
    <div class="book-meta">${esc(b.author)}<br>${esc(b.lang)} · ${esc(b.genre)}</div>
    <div style="margin-top:.5rem">${badge}</div>
  </div>`;
}
function esc(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
