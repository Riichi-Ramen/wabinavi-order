<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍳 Kuchnia — WABI NAVI</title>
<style>
:root{
  --bg:#14100d;--panel:#1f1a16;--panel2:#292320;--line:rgba(255,255,255,.10);
  --txt:#f4ede4;--muted:#a9998a;--accent:#e0563f;--ok:#2fa15a;--warn:#e8b32a;--danger:#e0433a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;overscroll-behavior:none}

#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:900;padding:1.5rem}
.lock-box{background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:2rem 1.6rem;width:100%;max-width:400px;text-align:center}
.lock-box h1{font-size:1.15rem;margin-bottom:.3rem}
.lock-box p{font-size:.8rem;color:var(--muted);margin-bottom:1.3rem;line-height:1.7}
.lock-box input{width:100%;padding:.85rem;border-radius:10px;border:1.5px solid var(--line);
  background:var(--panel2);color:var(--txt);font-size:1.05rem;text-align:center;margin-bottom:.8rem}
.lock-box input:focus{outline:none;border-color:var(--accent)}
.lock-box button{width:100%;padding:.85rem;border:none;border-radius:10px;background:var(--accent);
  color:#fff;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
#lock-err{display:none;background:rgba(224,67,58,.12);border:1px solid var(--danger);
  color:#ff9b93;border-radius:10px;padding:.6rem;font-size:.8rem;margin-bottom:.8rem;line-height:1.6}

#bar{position:sticky;top:0;z-index:100;background:rgba(20,16,13,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:.55rem .8rem;display:flex;align-items:center;
  gap:.6rem;flex-wrap:wrap}
.brand{font-size:1rem;font-weight:800;white-space:nowrap}
.brand small{display:block;font-size:.62rem;font-weight:400;color:var(--muted)}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:.3rem .7rem;font-size:.78rem;white-space:nowrap;line-height:1.35}
.stat b{font-size:1.15rem;display:block}
.spacer{flex:1}
.tab{background:transparent;border:1.5px solid var(--line);color:var(--muted);border-radius:10px;
  padding:.45rem .9rem;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
#clock{font-variant-numeric:tabular-nums;font-size:1.05rem;font-weight:700}
#pulse{width:9px;height:9px;border-radius:50%;background:var(--ok);opacity:.35;transition:opacity .2s}
#pulse.live{opacity:1;box-shadow:0 0 8px var(--ok)}

#agg{padding:.6rem .8rem;display:flex;gap:.55rem;flex-wrap:wrap;align-items:stretch;
  border-bottom:1px solid var(--line);background:var(--panel)}
.agg-empty{color:var(--muted);font-size:.82rem;padding:.4rem}
.agg-grp{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  padding:.45rem .7rem;min-width:118px}
.agg-grp .agg-h{font-size:.66rem;color:var(--muted);margin-bottom:.25rem;letter-spacing:.03em}
.agg-row{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;
  font-size:.82rem;line-height:1.6}
.agg-row b{font-size:1.3rem;font-variant-numeric:tabular-nums}
.agg-grp.hot{border-color:var(--accent)}

#board{padding:.7rem;display:grid;gap:.7rem;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));align-items:start}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;
  position:relative;touch-action:pan-y;transition:transform .18s ease,opacity .18s ease}
.card.lead{grid-column:span 2}
@media(max-width:700px){.card.lead{grid-column:span 1}}
.card.swiping{transition:none}
.card.gone{transform:translateX(-120%);opacity:0}
.c-head{display:flex;align-items:center;gap:.5rem;padding:.55rem .75rem;
  background:var(--panel2);border-bottom:1px solid var(--line)}
.c-table{font-size:1.5rem;font-weight:800;line-height:1}
.card.lead .c-table{font-size:2rem}
.c-sub{font-size:.66rem;color:var(--muted);line-height:1.4}
.c-timer{margin-left:auto;font-size:1rem;font-weight:800;font-variant-numeric:tabular-nums;
  border-radius:9px;padding:.25rem .6rem;background:rgba(255,255,255,.07)}
.card.warn{border-color:var(--warn)}
.card.warn .c-timer{background:var(--warn);color:#2c1810;animation:blink 1.1s ease-in-out infinite}
.card.late{border-color:var(--danger)}
.card.late .c-timer{background:var(--danger);color:#fff;animation:blink .62s ease-in-out infinite}
.card.late .c-head{background:rgba(224,67,58,.18)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

.c-note{margin:.5rem .75rem 0;padding:.45rem .6rem;border-radius:10px;font-size:.78rem;
  line-height:1.6;background:rgba(232,179,42,.12);border:1px solid rgba(232,179,42,.45);color:#ffdf9b}
.items{padding:.45rem .5rem .2rem}
.it{display:flex;align-items:flex-start;gap:.55rem;padding:.5rem .3rem;border-radius:10px;
  border-bottom:1px solid var(--line);cursor:pointer}
.it:last-child{border-bottom:none}
.it:active{background:rgba(255,255,255,.05)}
.it-q{min-width:2.3rem;text-align:center;font-size:1.15rem;font-weight:800;
  background:rgba(255,255,255,.08);border-radius:8px;padding:.15rem 0;font-variant-numeric:tabular-nums}
.card.lead .it-q{font-size:1.35rem}
.it-b{flex:1;min-width:0}
.it-n{font-size:.95rem;font-weight:700;line-height:1.35;word-break:break-word}
.card.lead .it-n{font-size:1.08rem}
.it-jp{font-size:.72rem;color:var(--muted)}

.tp-row{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.3rem}
.tp{display:inline-flex;align-items:baseline;gap:.2rem;font-size:.72rem;line-height:1.35;
  border-radius:6px;padding:.12rem .4rem;background:rgba(120,180,255,.15);color:#bcdcff}
.card.lead .tp{font-size:.8rem;padding:.16rem .5rem}
.tp i{font-style:normal;opacity:.75;font-size:.92em}
.tp.gone{background:rgba(224,67,58,.14);color:#ff9b93;text-decoration:line-through;
  text-decoration-thickness:2px;opacity:.85}
.tp.add{background:rgba(232,179,42,.28);color:#ffe08a;font-weight:800}
.tp.base{background:rgba(200,169,110,.22);color:#f0d9a8;font-weight:700}
.tp-lbl{font-size:.62rem;letter-spacing:.06em;color:var(--muted);align-self:center;
  padding:.1rem .25rem 0 0}
.tp.chg{background:rgba(232,179,42,.20);color:#ffdf9b;font-weight:700}
.c-guests{font-size:.82rem;font-weight:700;color:#ffd7a1;background:rgba(255,255,255,.09);
  border-radius:8px;padding:.1rem .45rem;margin-left:.35rem}
.card.lead .c-guests{font-size:.95rem}
.it-memo{font-size:.75rem;line-height:1.55;margin-top:.2rem;color:#ffcf7a;white-space:pre-line}
.it-memo .rm{color:#ff9b93}
.it-tag{display:inline-block;font-size:.64rem;font-weight:700;border-radius:6px;
  padding:.06rem .4rem;margin-right:.25rem;vertical-align:1px}
.tag-broth{background:rgba(255,255,255,.13);color:var(--txt)}
.tag-wynos{background:#5b2b26;color:#ffb3ab}
.tag-kae{background:#5a4a1e;color:#ffd98a}
.tag-split{background:#1e3f5a;color:#9fd8ff}
.agg-row.sum{border-top:1px solid var(--line);margin-top:.25rem;padding-top:.25rem}
.agg-row .u{font-size:.66rem;opacity:.8;margin-left:.1rem}
.it.doing{background:rgba(47,161,90,.12)}
.doing-label{font-size:.68rem;color:#84dda3;font-weight:700}
.it-x{width:34px;height:34px;flex-shrink:0;border-radius:9px;border:1.5px solid var(--line);
  background:transparent;color:var(--muted);font-size:1rem;cursor:pointer;font-family:inherit}
.it-x:active{background:var(--ok);border-color:var(--ok);color:#fff}

.c-foot{display:flex;gap:.45rem;padding:.5rem .6rem .6rem}
.btn{flex:1;padding:.6rem .3rem;border:none;border-radius:11px;font-size:.85rem;font-weight:800;
  cursor:pointer;font-family:inherit;line-height:1.3}
.btn small{display:block;font-size:.62rem;font-weight:400;opacity:.85}
.btn-go{background:rgba(255,255,255,.09);color:var(--txt);border:1.5px solid var(--line)}
.btn-done{background:var(--ok);color:#fff}
.btn-undo{background:rgba(255,255,255,.09);color:var(--txt);border:1.5px solid var(--line)}
.swipe-hint{position:absolute;inset:0;display:flex;align-items:center;padding-left:1.2rem;
  font-size:1.5rem;color:var(--ok);opacity:0;pointer-events:none}
.card.swiping .swipe-hint{opacity:1}

#empty{padding:3rem 1rem;text-align:center;color:var(--muted);font-size:1rem;line-height:2}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#2fa15a;
  color:#fff;padding:.65rem 1.2rem;border-radius:12px;font-size:.9rem;font-weight:700;
  z-index:800;display:none;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:92vw;text-align:center}
#toast.err{background:var(--danger)}

.tp.removed{background:#781f24;color:#fff;text-decoration:line-through;text-decoration-thickness:2px}
.tp.add{background:#165c30;color:#fff;font-weight:800}
.tp.base{background:#66501e;color:#fff;font-size:.85rem;border:1px solid #e7c66c}
.tp-lbl{color:#dfd3c6;font-size:.7rem}
.it-actions{display:flex;gap:.25rem;flex-wrap:wrap;max-width:80px;justify-content:flex-end}
.it-urgent{border:1px solid #fa9595;background:#561a1a;color:#fff;border-radius:7px;padding:.3rem;font:inherit;font-size:.65rem;font-weight:700;cursor:pointer}
.it.urgent{border:3px solid #ff6868;margin:.25rem 0}
.urgent-band{background:#871e26;color:#fff;padding:.15rem .4rem;border-radius:4px;font-size:.75rem;font-weight:800;margin-bottom:.3rem}
.group-head{display:flex;align-items:center;gap:.3rem;padding:.4rem 0;font-size:.75rem}
.group-head .btn{font-size:.7rem;padding:.4rem .2rem}
#agg{padding:.25rem .8rem;display:block}
#agg-toggle{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--txt);font:700 .8rem/1.5 system-ui;cursor:pointer;white-space:nowrap;overflow:auto;padding:.2rem 0}
#agg-details:not([hidden]){display:flex;flex-wrap:wrap;gap:.5rem;padding:.5rem 0}
.it-b,.c-head>div{min-width:0;overflow-wrap:anywhere}
</style>
</head>
<body>

<div id="lock">
  <div class="lock-box">
    <h1>🍳 Kuchnia</h1>
    <p>Wprowadź hasło obsługi.</p>
    <div id="lock-err"></div>
    <input type="password" id="pw" placeholder="Hasło" autocomplete="current-password">
    <button onclick="doLogin()">🔓 Otwórz</button>
  </div>
</div>

<div id="app" style="display:none">
  <div id="bar">
    <div class="brand">🍳 Kuchnia<small>WABI NAVI · v1.2</small></div>
    <div class="stat">Stoliki<b id="s-tables">0</b></div>
    <div class="stat">Pozycje<b id="s-items">0</b></div>
    <div class="stat" id="s-late-box">Ponad 20 min<b id="s-late">0</b></div>
    <div class="spacer"></div>
    <button class="tab" onclick="setFont(-1)" data-pl="A−"></button><button class="tab" onclick="setFont(1)" data-pl="A＋"></button><div id="pulse"></div>
    <div id="clock">--:--</div>
    <button class="tab on" id="tab-active" onclick="setView('active')">🍜 W kuchni<br></button>
    <button class="tab" id="tab-history" onclick="setView('history')">📋 Gotowe<br></button>
  </div>
  <div id="agg"></div>
  <div id="board"></div>
  <div id="empty" style="display:none"></div>
</div>

<div id="toast"></div>

<script>
const KDS_GROUP_BUTTONS = true;

const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbztP0245VXY7DRrjOQC9m4tu-DWKcGzPwT0QzBNgxfLxgczmYmQYlP8ErEz4umoJ3FN/exec";
try { localStorage.removeItem('wabi_gas_url'); } catch (e) {}
function gasUrl(){ return DEFAULT_GAS_URL; }

const POLL_MS   = 12000;
const WARN_MIN  = 10;
const LATE_MIN  = 20;
const LEAD_CNT  = 1;

const ST = { NEW:"NOWE", DOING:"W TRAKCIE",
             READY:"GOTOWE", SERVED:"WYDANE" };

const BROTH = {
  tori:  { icon:"🐔", pl:"Bulion drobiowy",  short:"Drobiowy" },
  buta:  { icon:"🐖", pl:"Bulion wieprzowy", short:"Wieprzowy" },
  oferta:{ icon:"⭐", pl:"Oferta specjalna", short:"Specjalne" },
  zimne: { icon:"❄️", pl:"Na zimno",         short:"Zimne" },
  inne:  { icon:"🍥", pl:"Inne",             short:"Inne" }
};

const AGG_GROUPS = [
  { key:"ramen",   icon:"🍜", pl:"Ramen — makaron", test:it=>it.cat==="ramen" },
  { key:"gyoza",   icon:"🥟", pl:"Gyoza",           test:it=>/gyoza/i.test(it.name) },
  { key:"karaage", icon:"🍗", pl:"Smażone",
    test:it=>/karaage|tempura|panko|frytk|krewetki w ziemniakach|takoyaki/i.test(it.name) },
  { key:"don",     icon:"🍚", pl:"Dania z ryżem",     test:it=>it.cat==="onigiri" },
  { key:"inne",    icon:"🍽",  pl:"Pozostałe",         test:()=>true }
];

function kaedamaBalls(memo) {
  const m = String(memo || '');
  if (/Kaedama (?:1\/2|×0,5)|Pół porcji/i.test(m)) return 0.5;
  if (/Kaedama|Pełna porcja/i.test(m)) return 1;
  return 0;
}
function isSplitBowl(memo) {
  return /Tak,\s*podziel|2 miski/i.test(String(memo || ''));
}
function numBall(n) { return (n % 1 === 0) ? String(n) : n.toFixed(1).replace('.', ','); }

function polish(value) {
  return String(value == null ? '' : value)
    .replace(/（[^）]*）/g, '').replace(/[\u3040-\u30ff\u4e00-\u9fff]+/g, '')
    .replace(/\s*\/\s*(?:Half|Full|Yes, split!|No|Standard)[^,\n]*/g, '')
    .replace(/Pół porcji/gi, 'Kaedama ×0,5').replace(/Pełna porcja/gi, 'Kaedama ×1')
    .replace(/Tak,\s*podziel![^\n]*/gi, '2 miski').trim();
}
function posBar(pos) {
  const list = key => Array.isArray(pos[key]) ? pos[key] : [];
  const chips = (key, label, cls) => list(key).length ? `<div class="tp-row"><b class="tp-lbl">${esc(label)}</b>${list(key).map(v => `<span class="tp ${cls}">${esc(polish(v))}</span>`).join('')}</div>` : '';
  return chips('baza', 'BAZA', 'base') +
    (list('dodatki').length ? `<div class="tp-row"><b class="tp-lbl">${esc('DODATKI')}</b>${list('dodatki').map(d => {
      const removed = d.state === 'removed', added = d.state === 'added';
      return `<span class="tp ${removed ? 'removed' : added ? 'add' : ''}">${esc((removed ? '➖ ' : added ? '➕ ' : '') + polish(d.name) + (Number(d.qty) >= 2 ? ' ×' + Number(d.qty) : ''))}</span>`;
    }).join('')}</div>` : '') +
    `<div class="tp-row">${list('tags').concat(list('other')).map(t => `<span class="tp chg">${esc(polish(t).replace(/Kaedama 1\/2/g, 'Kaedama ×0,5'))}</span>`).join('')}</div>`;
}
let fontSize = 0, aggOpen = false;
function setFont(delta) {
  fontSize = Math.max(0, Math.min(2, fontSize + delta));
  document.documentElement.style.fontSize = [16,18,20][fontSize] + 'px';
  try { localStorage.setItem('wabi_kds_fs', String(fontSize)); } catch(e) {}
}
function toggleAgg() { aggOpen = !aggOpen; renderAgg(); }
function urgentTime(o) {
  const times = o.items.map(i => Number(i.urgentAt)).filter(t => t > 0);
  return times.length ? Math.min(...times) : Infinity;
}
function displayedOrders() {
  return ORDERS.slice().sort((a,b) => (VIEW === 'active' ? urgentTime(a) - urgentTime(b) : 0) || a.ts - b.ts);
}
function handler(code) { return esc(code); }
function callCode(fn, ...args) { return handler(fn + '(' + args.map(a => JSON.stringify(a)).join(',') + ')'); }

let PASSWORD = "";
let VIEW = "active";
let ORDERS = [];
let MENU_IDX = {};
let MENU_BY_NAME = {};
let timer = null, clockTimer = null, busy = false;

window.addEventListener('DOMContentLoaded', () => {
  try { const n = Number(localStorage.getItem('wabi_kds_fs')); if (Number.isInteger(n) && n >= 0 && n <= 2) fontSize = n; } catch(e) {}
  setFont(0);
  document.querySelectorAll('body *:not(script):not(style)').forEach(el => {
    Array.from(el.childNodes).filter(n => n.nodeType === 3 && n.textContent.trim()).forEach(n => {
      const template = document.createElement('template');
      template.innerHTML = esc(n.textContent);
      n.replaceWith(template.content);
    });
  });
  document.querySelectorAll('[data-pl]').forEach(el => { el.innerHTML = esc(el.dataset.pl); });
  // 2026-11-03：厨房の端末は「一度だけ登録」して、以後はパスワード入力なし。
  //   サーバー側のパスワード照合は残す（URLを知るだけでは注文は見えない）。
  //   登録：kitchen.html#k=<パスワード> を一度だけ開く（# 以降はアドレスから消える）／手入力でログインしても保存。
  //   解除：kitchen.html?staff=0 。保存先は books/staff/reservations と共通のキー wabi_staff_pw。
  try {
    const rel = new URLSearchParams(location.search).get('staff') === '0';
    const km = /(?:^|[#&])k=([^&]*)/.exec(location.hash || '');
    if (rel) {
      ['wabi_staff_device', 'wabi_staff_pw', 'wabi_staff_pw_saved'].forEach(k => localStorage.removeItem(k));
      try { sessionStorage.removeItem('wabi_kds_pw'); } catch (e) {}
      history.replaceState(null, '', location.pathname);
    } else if (km && km[1]) {
      localStorage.setItem('wabi_staff_pw', decodeURIComponent(km[1]));
      localStorage.setItem('wabi_staff_device', '1');
      history.replaceState(null, '', location.pathname + location.search);
    }
  } catch (e) {}
  let saved = "";
  try { saved = localStorage.getItem('wabi_staff_pw') || sessionStorage.getItem('wabi_kds_pw') || ""; } catch(e){}
  if (saved) { document.getElementById('pw').value = saved; doLogin(true); }
  document.getElementById('pw').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
});

async function doLogin(silent) {
  const pw = document.getElementById('pw').value.trim();
  const err = document.getElementById('lock-err');
  if (!pw) { if(!silent){ err.innerHTML = esc('Wpisz hasło'); err.style.display='block'; } return; }
  PASSWORD = pw;
  err.style.display = 'none';
  const res = await fetchKitchen('active');
  if (!res || res.status === 'unauthorized') {
    // 保存した違うパスワードを残すと、開くたびに失敗が数えられてロック（5回・15分）になる。
    // その場で消す。ただしロック中の応答・通信エラーのときは消さない。
    if (res && res.status === 'unauthorized' && !/prób|15|limit|上限/i.test(res.message || '')) {
      try { localStorage.removeItem('wabi_staff_pw'); sessionStorage.removeItem('wabi_kds_pw'); } catch (e) {}
      document.getElementById('pw').value = '';
    }
    err.innerHTML = esc('Błąd logowania');
    err.style.display = 'block';
    PASSWORD = "";
    return;
  }
  try { localStorage.setItem('wabi_staff_pw', pw); localStorage.setItem('wabi_staff_device', '1'); } catch(e){}
  document.getElementById('lock').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  applyData(res);
  loadMenuIndex();
  startTimers();
}

async function loadMenuIndex() {
  try {
    const r = await fetch(gasUrl() + '?action=getMenu');
    const d = await r.json();
    if (d.status !== 'ok' || !Array.isArray(d.menu)) return;
    MENU_IDX = {}; MENU_BY_NAME = {};
    d.menu.forEach(cat => (cat.items || []).forEach(it => {
      const rec = { cat: cat.id, broth: it.brothBase || 'inne', name: it.namePL || '' };
      MENU_IDX[it.id] = rec;

      if (/^p_/.test(it.id)) MENU_IDX[it.id.replace(/^p_/, '')] = rec;
      if (it.namePL) MENU_BY_NAME[it.namePL.toLowerCase()] = rec;
    }));
    render();
  } catch(e){  }
}

function lookup(item) {
  if (item.cat) return { cat:item.cat, broth:item.brothBase || 'inne' };
  if (item.itemId && MENU_IDX[item.itemId]) return MENU_IDX[item.itemId];
  const clean = (item.namePL || '').replace(/^【[^】]*】\s*/, '').trim().toLowerCase();
  if (MENU_BY_NAME[clean]) return MENU_BY_NAME[clean];
  return { cat:'', broth:'inne', jp:'', name:'' };
}

function staffRead_(url){
  const u = new URL(url, location.href);
  const o = { action:'staffRead', read:u.searchParams.get('action') };
  u.searchParams.forEach(function(v,k){ if(k!=='action' && k!=='_') o[k]=v; });
  return fetch(u.origin + u.pathname, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(o) });
}
async function fetchKitchen(mode) {
  try {
    const u = gasUrl() + '?action=getKitchen&mode=' + encodeURIComponent(mode) +
              '&password=' + encodeURIComponent(PASSWORD) + '&_=' + Date.now();
    const r = await staffRead_(u);
    return await r.json();
  } catch(e) { return null; }
}

async function poll() {
  if (busy) return;
  const res = await fetchKitchen(VIEW);
  pulse(!!res);
  if (res && res.status === 'ok') applyData(res);
}

function pulse(ok) {
  const p = document.getElementById('pulse');
  p.style.background = ok ? 'var(--ok)' : 'var(--danger)';
  p.classList.add('live');
  setTimeout(() => p.classList.remove('live'), 600);
}

function applyData(res) {
  ORDERS = res.orders || [];
  render();
}

function startTimers() {
  if (timer) clearInterval(timer);
  if (clockTimer) clearInterval(clockTimer);
  timer = setInterval(poll, POLL_MS);
  clockTimer = setInterval(() => { tickClock(); render(true); }, 15000);
  tickClock();
}

function tickClock() {
  const d = new Date();
  document.getElementById('clock').innerHTML = esc(
    ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2));
}

function setView(v) {
  VIEW = v;
  document.getElementById('tab-active').classList.toggle('on', v === 'active');
  document.getElementById('tab-history').classList.toggle('on', v === 'history');
  document.getElementById('board').innerHTML =
    '<div style="color:var(--muted);padding:1rem">' + esc('Ładowanie…') + '</div>';
  poll();
}

function minutesSince(ts) { return Math.max(0, Math.floor((Date.now() - ts) / 60000)); }
function fmtElapsed(m) { return m < 60 ? m + "′" : Math.floor(m/60) + "h" + ('0'+(m%60)).slice(-2); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(timeOnly) {
  const board = document.getElementById('board');
  const emptyEl = document.getElementById('empty');

  let itemCount = 0, lateCount = 0;
  ORDERS.forEach(o => {
    o.items.forEach(i => { itemCount += (i.qty || 1); });
    if (VIEW === 'active' && minutesSince(o.ts) >= LATE_MIN) lateCount++;
  });
  document.getElementById('s-tables').innerHTML = esc(ORDERS.length);
  document.getElementById('s-items').innerHTML = esc(itemCount);
  document.getElementById('s-late').innerHTML = esc(lateCount);
  document.getElementById('s-late-box').style.borderColor =
    lateCount ? 'var(--danger)' : 'var(--line)';

  renderAgg();

  if (!ORDERS.length) {
    board.innerHTML = '';
    emptyEl.style.display = 'block';
    emptyEl.innerHTML = VIEW === 'active'
      ? esc('🍃') + '<br>' + esc('Brak zamówień w kuchni')
      : esc('📋') + '<br>' + esc('Nic jeszcze nie ukończono dziś');
    return;
  }
  emptyEl.style.display = 'none';
  board.innerHTML = displayedOrders().map((o, i) => cardHtml(o, i)).join('');
  if (VIEW === 'active') ORDERS.forEach(o => attachSwipe(o.orderId));
}

function renderAgg() {
  const el = document.getElementById('agg');
  if (VIEW !== 'active' || !ORDERS.length) { el.innerHTML = ''; el.style.display='none'; return; }
  el.style.display = 'flex';

  const buckets = {};
  let bowls = 0;
  let extraBalls = 0;
  let splitBowls = 0;

  ORDERS.forEach(o => o.items.forEach(it => {
    const info = lookup(it);
    const name = (it.namePL || '').replace(/^【[^】]*】\s*/, '');
    const q = it.qty || 1;

    if (it.itemId === 'd_noodle1' || /dodatkowa porcja makaronu/i.test(name)) {
      extraBalls += q; return;
    }
    if (it.itemId === 'd_noodle2' || /pół porcji makaronu/i.test(name)) {
      extraBalls += 0.5 * q; return;
    }

    const probe = { cat: info.cat, name: name };
    const g = AGG_GROUPS.find(x => x.test(probe)) || AGG_GROUPS[AGG_GROUPS.length - 1];
    let label;
    if (g.key === 'ramen') {
      const b = BROTH[info.broth] || BROTH.inne;
      label = b.icon + ' ' + b.short;
      bowls      += q;
      extraBalls += kaedamaBalls(it.pos ? (it.pos.tags || []).join(' ') : it.memo) * q;
      if (isSplitBowl(it.pos ? (it.pos.tags || []).join(' ') : it.memo)) splitBowls += q;
    } else if (g.key === 'inne') {
      return;
    } else {
      label = name.replace(/\s*[—–-]\s*/, ' ').slice(0, 22);
    }
    if (!buckets[g.key]) buckets[g.key] = {};
    buckets[g.key][label] = (buckets[g.key][label] || 0) + q;
  }));

  if (extraBalls > 0 && !buckets.ramen) buckets.ramen = {};

  const html = AGG_GROUPS.filter(g => buckets[g.key]).map(g => {
    const b = buckets[g.key];
    let rows = Object.keys(b).sort((x, y) => b[y] - b[x])
      .map(k => `<div class="agg-row"><span>${esc(k)}</span><b>${esc(b[k])}</b></div>`)
      .join('');
    let total = Object.values(b).reduce((a, c) => a + c, 0);

    if (g.key === 'ramen') {
      if (extraBalls > 0) {
        rows += `<div class="agg-row" style="color:#ffd98a">
          <span>${esc('＋ Kaedama')}</span><b>${esc(numBall(extraBalls))}</b></div>`;
      }
      if (splitBowls > 0) {
        rows += `<div class="agg-row" style="color:#9fd8ff">
          <span>${esc('✌️ 2 miski')}</span><b>${esc(splitBowls)}</b></div>`;
      }
      total = bowls + extraBalls;
      rows += `<div class="agg-row sum"><span>${esc('🍜 Makaron razem')}</span>
        <b>${esc(numBall(total))}</b></div>`;
    }
    return `<div class="agg-grp${total >= 3 ? ' hot' : ''}">
      <div class="agg-h">${esc(g.icon)} ${esc(g.pl)}</div>${rows}</div>`;
  }).join('');

  const summary = `🍜 Ramen ${bowls}${buckets.ramen ? ' (' + Object.entries(buckets.ramen).map(([k,v]) => k.replace('🐖 Wieprzowy','Wieprz.').replace('🐔 Drobiowy','Drob.').replace('⭐ Specjalne','Spec.') + ' ' + v).join(' · ') + ')' : ''} · Kaedama ${numBall(extraBalls)} · Makaron razem ${numBall(bowls + extraBalls)}` + AGG_GROUPS.filter(g => g.key !== 'ramen' && buckets[g.key]).map(g => ' · ' + g.icon + ' ' + Object.values(buckets[g.key]).reduce((a,b) => a+b,0)).join('');
  el.innerHTML = `<button id="agg-toggle" onclick="toggleAgg()" aria-expanded="${aggOpen}">${esc(summary)} ${esc(aggOpen ? '▴' : '▾')}</button><div id="agg-details" ${aggOpen ? '' : 'hidden'}>${html}</div>`;
}

function cardHtml(o, idx) {
  const mins = minutesSince(o.ts);
  const cls = [];
  if (idx < LEAD_CNT) cls.push('lead');
  if (VIEW === 'active') {
    if (mins >= LATE_MIN) cls.push('late');
    else if (mins >= WARN_MIN) cls.push('warn');
  }

  const groups = [o.items.filter(it => lookup(it).cat === 'ramen'), o.items.filter(it => lookup(it).cat !== 'ramen')];
  const grouped = KDS_GROUP_BUTTONS && groups.every(g => g.length) && VIEW === 'active';
  const items = groups.map((g, index) => (grouped ? `<div class="group-head"><b>${esc(index === 0 ? 'RAMEN' : 'RESZTA')}</b><button class="btn btn-go" onclick="${callCode('markGroup', o.orderId, g.map(i => i.no), ST.DOING)}">${esc('Zaczynam')}</button><button class="btn btn-done" onclick="${callCode('markGroup', o.orderId, g.map(i => i.no), ST.READY)}">${esc('Gotowe')}</button></div>` : '') + g.map(it => itemHtml(o,it)).join('')).join('');
  const note = o.uwagi
    ? `<div class="c-note">📝 ${esc(polish(o.uwagi))}</div>` : '';
  const member = o.member && /Członek|Member/i.test(o.member)
    ? ` · ⭐${esc(polish(o.memberName || 'Członek'))}` : '';

  const foot = VIEW === 'active'
    ? `<div class="c-foot">
         <button class="btn btn-go" onclick="${callCode('markOrder',o.orderId,ST.DOING)}">
           ${esc('👨‍🍳 Zaczynam')}</button>
         <button class="btn btn-done" onclick="${callCode('markOrder',o.orderId,ST.READY)}">
           ${esc('✅ Gotowe — wydać')}</button>
       </div>`
    : `<div class="c-foot">
         <button class="btn btn-undo" onclick="${callCode('markOrder',o.orderId,ST.NEW)}">
           ${esc('↩︎ Cofnij do kuchni')}</button>
       </div>`;

  return `<div class="card ${cls.join(' ')}" id="card-${esc(o.orderId)}" data-oid="${esc(o.orderId)}">
    <div class="swipe-hint">${esc('✅ Gotowe')}</div>
    <div class="c-head">
      <div>
        <div class="c-table">${esc(o.isDelivery ? ('🛵 DOWÓZ ' + (o.deliveryTime || '')) : ('🪑 ' + (o.table || '?')))}<span class="c-guests">${o.isDelivery ? '' : '👥 '}${
          ((String(o.guests || '').match(/\d+/) || ['?'])[0])} os.</span></div>
        <div class="c-sub">🕐 ${esc(o.hhmm)} przyjęto${member}<br>${esc(o.orderId)}</div>
      </div>
      <div class="c-timer">${esc(VIEW === 'active' ? fmtElapsed(mins) : '✓')}</div>
    </div>
    ${note}
    <div class="items">${items}</div>
    ${foot}
  </div>`;
}

function itemHtml(o, it) {
  const payer = (it.namePL || '').match(/^【([^】]*)】/);
  const doing = /W TRAKCIE|IN PROGRESS/i.test(it.status || '');
  const urgent = Number(it.urgentAt) > 0;
  const memo = it.pos && typeof it.pos === 'object' ? posBar(it.pos) :
    (it.memo && it.memo !== '—' ? `<div class="it-memo">${esc(polish(it.memo))}</div>` : '');
  const btn = VIEW === 'active' ? `<div class="it-actions"><button class="it-urgent" aria-pressed="${urgent}" onclick="event.stopPropagation();${callCode('markUrgent',o.orderId,it.no,!urgent)}">${esc('🔥 PILNE')}</button><button class="it-x" onclick="event.stopPropagation();${callCode('markItem',o.orderId,it.no,ST.READY)}" title="${esc('Ta pozycja gotowa')}">${esc('✓')}</button></div>` : '';
  return `<div class="it${doing ? ' doing' : ''}${urgent ? ' urgent' : ''}" onclick="${callCode('markItem',o.orderId,it.no,doing ? ST.NEW : ST.DOING)}">
    <div class="it-q">${esc('×' + it.qty)}</div><div class="it-b">
    ${urgent ? `<div class="urgent-band">${esc('PILNE · ' + minutesSince(it.urgentAt) + ' min')}</div>` : ''}
    <div class="it-n">${payer ? `<span class="it-tag tag-broth">${esc(polish(payer[1]))}</span>` : ''}${esc(polish((it.namePL || '').replace(/^【[^】]*】\s*/, '')))}${doing ? `<span class="doing-label">${esc(' ● W trakcie')}</span>` : ''}</div>${memo}</div>${btn}</div>`;
}
async function markGroup(orderId, itemNos, newStatus) {
  if (busy || !await sendUpdate({orderId, itemNos, newStatus})) return;
  const o = ORDERS.find(o => o.orderId === orderId);
  if (!o) return;
  if (newStatus === ST.READY) o.items = o.items.filter(i => !itemNos.includes(i.no));
  else o.items.filter(i => itemNos.includes(i.no)).forEach(i => i.status = newStatus);
  if (!o.items.length) ORDERS = ORDERS.filter(o => o.orderId !== orderId);
  render();
}
async function markUrgent(orderId, itemNo, on) {
  if (busy) return;
  const result = await sendUpdate({orderId, itemNo, op:'urgent', on});
  if (!result) return;
  const o = ORDERS.find(o => o.orderId === orderId);
  const item = o && o.items.find(i => i.no === itemNo);
  if (item) item.urgentAt = on ? result.urgentAt || Date.now() : null;
  render();
}

async function sendUpdate(payload) {
  busy = true;
  try {
    const r = await fetch(gasUrl(), {
      method: 'POST', mode: 'cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: 'kitchenUpdate', password: PASSWORD }, payload))
    });
    const d = await r.json();
    busy = false;
    if (d.status !== 'ok') { toast('Błąd aktualizacji', true); return false; }
    return d;
  } catch(e) {
    busy = false;
    toast('📡 Brak połączenia', true);
    return false;
  }
}

async function markOrder(orderId, newStatus) {
  const card = document.getElementById('card-' + orderId);
  const leaving = (newStatus === ST.READY || newStatus === ST.NEW);
  if (card && leaving) card.classList.add('gone');
  const ok = await sendUpdate({ orderId, newStatus });
  if (!ok) { if (card) card.classList.remove('gone'); return; }
  if (leaving) {
    ORDERS = ORDERS.filter(o => o.orderId !== orderId);
    setTimeout(render, 160);
    toast(newStatus === ST.READY
      ? '✅ Wydać — ' + orderId
      : '↩︎ Wrócono do kuchni');
  } else {
    const o = ORDERS.find(x => x.orderId === orderId);
    if (o) o.items.forEach(i => i.status = newStatus);
    render();
    toast('👨‍🍳 W trakcie — ' + orderId);
  }
}

async function markItem(orderId, itemNo, newStatus) {
  const ok = await sendUpdate({ orderId, itemNo, newStatus });
  if (!ok) return;
  const o = ORDERS.find(x => x.orderId === orderId);
  if (!o) return;
  if (newStatus === ST.READY) {
    o.items = o.items.filter(i => i.no !== itemNo);
    if (!o.items.length) ORDERS = ORDERS.filter(x => x.orderId !== orderId);
  } else {
    const it = o.items.find(i => i.no === itemNo);
    if (it) it.status = newStatus;
  }
  render();
}

function attachSwipe(orderId) {
  const el = document.getElementById('card-' + orderId);
  if (!el || el.dataset.sw) return;
  el.dataset.sw = '1';
  let x0 = 0, y0 = 0, dx = 0, active = false;

  el.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; active = true;
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    if (!active) return;
    const cx = e.touches[0].clientX, cy = e.touches[0].clientY;
    if (Math.abs(cy - y0) > Math.abs(cx - x0)) { active = false; el.style.transform = ''; return; }
    dx = cx - x0;
    if (dx > 0) dx = dx * 0.25;
    el.classList.add('swiping');
    el.style.transform = 'translateX(' + dx + 'px)';
    el.style.opacity = String(Math.max(0.35, 1 - Math.abs(dx) / 380));
  }, { passive: true });

  const end = () => {
    if (!active) return;
    active = false;
    el.classList.remove('swiping');
    el.style.transform = ''; el.style.opacity = '';
    if (dx < -130) markOrder(orderId, ST.READY);
  };
  el.addEventListener('touchend', end, { passive: true });
  el.addEventListener('touchcancel', end, { passive: true });
}

function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.innerHTML = esc(polish(msg));
  t.className = isErr ? 'err' : '';
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.display = 'none'; }, 2600);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && PASSWORD) poll();
});
</script>
